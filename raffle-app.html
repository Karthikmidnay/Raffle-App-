/* Winner not in the room: void the last draw, keep them out of the pool,
   and record it so the export tells the truth. */
function markAbsent(){
  const live = liveWinners();
  if (!live.length || state.busy) return;
  const last = live[live.length - 1];
  last.status = 'absent';            // stays in state.drawn — cannot be redrawn
  $('meta').classList.remove('on');
  $('arena').classList.remove('revealed');
  $('arena').classList.add('idle');
  render();
}

/* ==================================================================
   9 · CSV IN AND OUT
   ================================================================== */
function splitRow(line, delim){
  const out = []; let cur = '', q = false;
  for (const ch of line){
    if (ch === '"') q = !q;
    else if (ch === delim && !q){ out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(x => x.trim().replace(/^"|"$/g,''));
}

/* Header names vary wildly between ticketing exports, so match on a
   normalised form: "Ticket ID", "ticket_no", "TicketNumber" all become
   "ticketid"/"ticketno"/"ticketnumber" and are compared against the lists
   below. Anything not on a list is ignored, not an error. */
const norm = h => h.toLowerCase().replace(/[^a-z0-9]/g, '');
const COLUMNS = {
  ticket:  ['ticketid','ticket','ticketno','ticketnumber','ticketcode','id','regid',
            'registrationid','registrationno','bookingid','bookingref','ref','refno','orderid'],
  name:    ['name','fullname','attendee','attendeename','membername','member','participant',
            'firstnamelastname','delegate','guestname'],
  company: ['company','companyname','organisation','organization','org','employer','agency','firm'],
  email:   ['email','emailaddress','mail','e mail'],
  checked: ['checkedin','checkin','attended','present','ischeckedin']
};

function importCSV(text, label){
  text = text.replace(/^\uFEFF/, '');          // Excel writes a UTF-8 BOM
  const lines = text.replace(/\r/g,'').split('\n').filter(l => l.trim());
  if (!lines.length) return flash(t('msgFileEmpty'), true);

  // Delimiter: whichever separator appears most in the header row.
  const delim = [',', ';', '\t', '|']
    .map(d => [d, lines[0].split(d).length])
    .sort((a,b) => b[1] - a[1])[0][0];

  const rawHead = splitRow(lines[0], delim);      // headers as written, for the extra columns
  const head = rawHead.map(norm);
  const col = key => { for (let i = 0; i < head.length; i++) if (COLUMNS[key].includes(head[i])) return i; return -1; };
  const iT = col('ticket'), iN = col('name'), iC = col('company'), iE = col('email'), iK = col('checked');

  /* A plain list exported from a spreadsheet often has no header at all —
     row 1 is already a name. If nothing matches a known column and every row
     holds a single value, treat the whole file as names, first row included. */
  let headerless = false;
  if (iN < 0){
    const singleColumn = lines.every(l => splitRow(l, delim).filter(v => v !== '').length <= 1);
    if (singleColumn){ headerless = true; }
    else {
      const found = splitRow(lines[0], delim).filter(Boolean).join(', ');
      return flash(t('msgMissingName') + ' Found: ' + found, true);
    }
  }
  /* A ticket column is optional. Without one the app numbers the rows itself,
     purely so each entry has a unique key internally, and hides the number
     from the screen — there is nothing for the prize desk to check it against. */
  const hasTickets = !headerless && iT > -1;
  const nameCol = headerless ? 0 : iN;
  const firstRow = headerless ? 0 : 1;          // no header means row 0 is data

  const rows = [], seen = new Set(); let skipped = 0, repeats = 0;
  for (let i = firstRow; i < lines.length; i++){
    const c = splitRow(lines[i], delim);
    const name = c[nameCol];
    if (!name){ skipped++; continue; }
    if (!headerless && iK > -1 && /^(false|0|no|n)$/i.test(c[iK] || '')) continue;

    const company = !headerless && iC > -1 ? c[iC] : '';
    const ticket = hasTickets ? c[iT] : 'R-' + String(rows.length + 1).padStart(3, '0');
    if (hasTickets && !ticket){ skipped++; continue; }

    /* With tickets, the ticket is the identity. Without one, the same name
       twice would otherwise get two entries and double that person's odds,
       so collapse them and say so — if they really are two people, the fix
       is to add a company or ticket column. */
    const key = hasTickets ? ticket : (name + '|' + company).toLowerCase().replace(/\s+/g,' ').trim();
    if (seen.has(key)){ hasTickets ? skipped++ : repeats++; continue; }
    seen.add(key);

    /* Everything the file had that we did not map to a known column is kept
       verbatim, in the file's own order, under its original header. It never
       goes on the projection screen — only into the winners list and export. */
    const extra = [];
    if (!headerless){
      const mapped = new Set([iT, iN, iC, iE, iK].filter(x => x > -1));
      rawHead.forEach((h, idx) => {
        if (mapped.has(idx)) return;
        const v = (c[idx] || '').trim();
        if (h && v) extra.push({ label: h, value: v });
      });
    }
    rows.push({ ticket, name, company, email: !headerless && iE > -1 ? c[iE] : '', extra });
  }
  if (!rows.length) return flash(t('msgNoRows'), true);

  ATTENDEES = rows;
  state.source = label;
  state.hasTickets = hasTickets;
  // Re-numbered rows invalidate any earlier draw, so start the pool clean.
  state.drawn.clear(); state.winners = [];
  render();
  flash(repeats ? t('msgLoadedRepeats', { count: rows.length, repeats })
      : skipped ? t('msgLoadedSkipped', { count: rows.length, skipped })
      :           t('msgLoaded', { count: rows.length }));
}

function exportWinners(){
  if (!state.winners.length) return flash(t('msgNothingToSave'), true);
  // Collect every extra header seen across the winners, in first-seen order,
  // so a file with per-row differences still exports as a rectangle.
  const extraCols = [];
  state.winners.forEach(w => (w.extra || []).forEach(x => {
    if (!extraCols.includes(x.label)) extraCols.push(x.label);
  }));
  const rows = [TEXT.exportHeaders.split(',').concat(extraCols)];
  state.winners.forEach((w,i) => {
    const map = {};
    (w.extra || []).forEach(x => map[x.label] = x.value);
    rows.push([
      i+1, w.ticket, w.name, w.company||'', w.email||'', w.status,
      w.sponsorName || '', w.prize || '', w.at
    ].concat(extraCols.map(k => map[k] || '')));
  });
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = t('exportFilename', { event: CONFIG.event.toLowerCase().replace(/[^a-z0-9]+/g,'-') });
  a.click();
  URL.revokeObjectURL(a.href);
  flash(t('msgExported'));
}

let flashTimer;
function flash(msg, bad){
  const el = $('status');
  el.innerHTML = `<span class="${bad ? 'bad' : 'ok'}">${esc(msg)}</span>`;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(render, 4500);
}

/* ==================================================================
   10 · WIRING
   ================================================================== */
$('drawBtn').onclick = draw;
$('undoBtn').onclick = markAbsent;
$('resetBtn').onclick = () => {
  if (state.busy) return;
  state.drawn.clear(); state.winners = [];
  $('meta').classList.remove('on');
  $('arena').classList.remove('revealed'); $('arena').classList.add('idle');
  render(); flash(t('msgCleared'));
};
$('downloadWinners').onclick = exportWinners;

$('soundBtn').onclick = e => {
  state.sound = !state.sound;
  e.target.setAttribute('aria-pressed', state.sound);
  e.target.textContent = t(state.sound ? 'opsSoundOn' : 'opsSoundOff');
};
$('cdBtn').onclick = e => {
  state.countdown = !state.countdown;
  e.target.setAttribute('aria-pressed', state.countdown);
  e.target.textContent = t(state.countdown ? 'opsCountdownOn' : 'opsCountdownOff');
};
$('themeBtn').onclick = () => {
  state.themeIdx = (state.themeIdx + 1) % state.themes.length;
  state.look.theme = state.themes[state.themeIdx];
  state.look.accent = ''; state.look.bg = '';
  applyLook();
  render();                       // the plate depends on the theme
  rememberSettings();
};
$('fsBtn').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
};

$('csv').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => importCSV(r.result, f.name);
  r.readAsText(f); e.target.value = '';
});

/* drag and drop a CSV anywhere on the window */
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; $('dropzone').classList.add('on'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) $('dropzone').classList.remove('on'); });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; $('dropzone').classList.remove('on');
  const f = e.dataTransfer.files[0];
  if (!f) return;
  const r = new FileReader();
  if (/\.json$/i.test(f.name)){ r.onload = () => loadSettingsFile(r.result, f.name); }
  else if (/\.csv$/i.test(f.name)){ r.onload = () => importCSV(r.result, f.name); }
  else return flash(t('msgNotCSV'), true);
  r.readAsText(f);
});

/* setup panel — edits one sponsor at a time, chosen by the picker */
let editIdx = 0;

function fillPanel(){
  const s = CONFIG.sponsors[editIdx];
  $('fEvent').value = CONFIG.event;
  $('fTitle').value = CONFIG.title;
  $('fEyebrow').value = CONFIG.eyebrow;
  $('fName').value = s.name;
  $('fTag').value = s.tagline;
  $('fDesc').value = s.description;
  $('fOffer').value = s.offer;
  $('fCount').value = s.winnerCount;
  const prev = $('sponsorBgPrev');
  prev.hidden = !s.bg;
  prev.style.backgroundImage = s.bg ? `url(${s.bg})` : '';
  $('fSponsorBg').value = '';
}

/* Write the visible fields back into the sponsor being edited. Called before
   switching sponsors too, so edits are never silently lost. */
function commitPanel(){
  CONFIG.event = $('fEvent').value.trim() || CONFIG.event;
  CONFIG.title = $('fTitle').value.trim() || CONFIG.title;
  CONFIG.eyebrow = $('fEyebrow').value.trim();
  const s = CONFIG.sponsors[editIdx];
  s.name = $('fName').value.trim() || s.name;
  s.tagline = $('fTag').value.trim();
  s.description = $('fDesc').value.trim();
  s.offer = $('fOffer').value.trim() || s.offer;
  s.winnerCount = Math.max(1, parseInt($('fCount').value, 10) || s.winnerCount);
}

function fillPicker(){
  $('fSponsorPick').innerHTML = CONFIG.sponsors
    .map((s,i) => `<option value="${i}"${i === editIdx ? ' selected' : ''}>${esc(s.name)}</option>`)
    .join('');
}

/* Snapshot so Cancel really cancels — the fields below now write straight
   through to the stage, which is the whole point of being able to see it. */
let setupSnapshot = null;

function livePanel(){
  ['fEvent','fTitle','fEyebrow','fName','fTag','fDesc','fOffer','fCount'].forEach(id => {
    const el = $(id);
    if (el.dataset.live) return;
    el.dataset.live = '1';
    el.addEventListener('input', () => { commitPanel(); render(); });
  });
}

function openSetup(){
  setupSnapshot = JSON.stringify({ event: CONFIG.event, title: CONFIG.title,
    eyebrow: CONFIG.eyebrow, sponsors: CONFIG.sponsors });
  livePanel();
  editIdx = CONFIG.activeSponsor;
  fillPicker(); fillPanel();
  $('setup').classList.add('on'); $('fName').focus();
}
$('winnersBtn').onclick = () => { renderWinnersPanel(); $('winnersPanel').classList.add('on'); };

/* Delete the imported file. The list only ever lived in this tab's memory —
   it is never written to storage and never leaves the machine — so dropping
   the array and the winners drawn from it is genuinely all of it. */
$('wipeBtn').onclick = () => {
  if (state.busy) return;
  if (state.source === TEXT.sourceDefault) return flash(t('msgWipeNothing'), true);
  if (!confirm(t('msgWipeConfirm'))) return;
  ATTENDEES = DEMO_ATTENDEES.map(a => ({ ...a }));
  state.hasTickets = true;
  state.source = TEXT.sourceDefault;
  state.drawn = new Set();
  state.winners = [];
  $('csv').value = '';
  $('meta').classList.remove('on');
  $('arena').classList.remove('revealed'); $('arena').classList.add('idle');
  render();
  flash(t('msgWiped'));
};

/* ---------- themes & designs ---------- */
$('looksBtn').onclick = () => { buildLooks(); $('looksPanel').classList.add('on'); };
$('closeLooks').onclick = () => $('looksPanel').classList.remove('on');
$('looksPanel').addEventListener('click', e => {
  if (e.target === $('looksPanel')) $('looksPanel').classList.remove('on');
});
$('cAccent').oninput = e => { state.look.accent = e.target.value; applyLook(); rememberSettings(); };
$('cBg').oninput     = e => { state.look.bg     = e.target.value; applyLook(); rememberSettings(); };
$('cAccentReset').onclick = () => { state.look.accent = ''; applyLook(); buildLooks(); rememberSettings(); };
$('cBgReset').onclick     = () => { state.look.bg     = ''; applyLook(); buildLooks(); rememberSettings(); };
$('fDisp').onchange = e => { state.look.fontDisp = e.target.value; applyLook(); buildLooks(); rememberSettings(); };
$('fBody').onchange = e => { state.look.fontBody = e.target.value; applyLook(); buildLooks(); rememberSettings(); };
$('bgDim').oninput  = e => { state.look.bgDim = +e.target.value; applyLook(); rememberSettings(); };
$('bgFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { state.look.bgImage = r.result; applyLook(); rememberSettings(); flash(t('msgBgSet')); };
  r.readAsDataURL(f);
  e.target.value = '';
});
$('bgRemove').onclick = () => {
  state.look.bgImage = null; applyLook(); rememberSettings(); flash(t('msgBgOff'));
};
$('looksResetAll').onclick = () => {
  state.look = { theme:'ink', design:'classic', winnerStyle:'blur', accent:'', bg:'',
                 fontDisp:'anton', fontBody:'archivo', bgImage:null, bgDim:55 };
  applyLook(); buildLooks(); rememberSettings(); flash(t('msgLookReset'));
};
$('closeWinners').onclick = () => $('winnersPanel').classList.remove('on');
$('winnersPanel').addEventListener('click', e => {
  if (e.target === $('winnersPanel')) $('winnersPanel').classList.remove('on');
});
$('copyWinners').onclick = async () => {
  const text = winnersAsText();
  try {
    await navigator.clipboard.writeText(text);
    flash(t('winnersCopied'));
  } catch (err) {
    // clipboard access is blocked on some file:// setups — fall back
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand && document.execCommand('copy');
    ta.remove();
    flash(ok ? t('winnersCopied') : t('winnersCopyFail'), !ok);
  }
};

$('sponsorsBtn').onclick = () => { renderSponsorCards(); $('sponsorPicker').classList.add('on'); };
$('closeSponsors').onclick = () => $('sponsorPicker').classList.remove('on');
$('sponsorPicker').addEventListener('click', e => {
  if (e.target === $('sponsorPicker')) $('sponsorPicker').classList.remove('on');
});
/* the sponsor bar on stage is also a way in */
$('sponsorBar').onclick = () => { renderSponsorCards(); $('sponsorPicker').classList.add('on'); };

$('setupBtn').onclick = openSetup;
$('closeSetup').onclick = () => {
  if (setupSnapshot){
    try {
      const back = JSON.parse(setupSnapshot);
      CONFIG.event = back.event; CONFIG.title = back.title; CONFIG.eyebrow = back.eyebrow;
      CONFIG.sponsors = back.sponsors;
      CONFIG.activeSponsor = Math.min(CONFIG.activeSponsor, CONFIG.sponsors.length - 1);
    } catch(err){}
  }
  $('setup').classList.remove('on');
  render();
};

$('fSponsorPick').addEventListener('change', e => {
  commitPanel();
  editIdx = +e.target.value;
  fillPicker(); fillPanel();
});

$('addSponsor').onclick = () => {
  commitPanel();
  CONFIG.sponsors.push({
    id: 's' + Date.now().toString(36),
    name: t('newSponsorName'), tagline: '', description: '',
    offer: t('newSponsorPrize'), winnerCount: 1, logo: null
  });
  editIdx = CONFIG.sponsors.length - 1;
  fillPicker(); fillPanel(); $('fName').select();
};

$('delSponsor').onclick = () => {
  if (CONFIG.sponsors.length < 2) return flash(t('msgLastSponsor'), true);
  const gone = CONFIG.sponsors.splice(editIdx, 1)[0];
  // Their winners stay in the record and stay out of the pool — deleting a
  // sponsor must never make someone eligible to win a second time.
  state.winners.forEach(w => { if (w.sponsorId === gone.id) w.sponsorName += ' (removed)'; });
  editIdx = Math.min(editIdx, CONFIG.sponsors.length - 1);
  CONFIG.activeSponsor = Math.min(CONFIG.activeSponsor, CONFIG.sponsors.length - 1);
  fillPicker(); fillPanel(); rememberSettings(); render();
};

$('saveSetup').onclick = () => {
  commitPanel();
  setupSnapshot = null;          // saved, so Cancel has nothing to undo
  CONFIG.activeSponsor = editIdx;
  $('setup').classList.remove('on');
  render();
  const kept = rememberSettings();
  flash(kept ? t('msgSponsorSaved') : t('msgSponsorNoSave'), !kept);
};

$('fLogo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    const out = await processLogo(r.result);
    const sp = CONFIG.sponsors[editIdx];
    sp.logo = out.url; sp.logoLum = out.lum;
    rememberSettings(); render();
  };
  r.readAsDataURL(f);
});
/* The event logo, changed per event. Same pipeline as sponsor logos so a
   dark-on-white mark still reads on a dark theme. */
$('fEventLogo').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = async () => {
    const out = await processLogo(r.result);
    CONFIG.eventLogo = out.url;
    rememberSettings(); render(); flash(t('msgEventLogoSet'));
  };
  r.readAsDataURL(f);
  e.target.value = '';
});
$('clearEventLogo').onclick = () => {
  CONFIG.eventLogo = null;
  rememberSettings(); render(); flash(t('msgEventLogoOff'));
};

/* A sponsor's own backdrop, set from the panel that edits that sponsor.
   It wins over the shared image in Themes & designs while they are on stage. */
$('fSponsorBg').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    CONFIG.sponsors[editIdx].bg = r.result;
    fillPanel(); rememberSettings(); render(); flash(t('msgSponsorBgSet'));
  };
  r.readAsDataURL(f);
  e.target.value = '';
});
$('sponsorBgClear').onclick = () => {
  CONFIG.sponsors[editIdx].bg = null;
  fillPanel(); rememberSettings(); render(); flash(t('msgSponsorBgOff'));
};
/* One image for the whole event, without setting it sponsor by sponsor. */
$('sponsorBgAll').onclick = () => {
  const src = CONFIG.sponsors[editIdx].bg;
  if (!src) return flash(t('msgSponsorBgNone'), true);
  CONFIG.sponsors.forEach(sp => sp.bg = src);
  fillPanel(); rememberSettings(); render();
  flash(t('msgSponsorBgAll', { n: CONFIG.sponsors.length }));
};

$('exportSettings').onclick = downloadSettings;
$('forgetSettings').onclick = () => {
  forgetSettings();
  $('setup').classList.remove('on');
  flash(t('msgForgot'));
};
$('importSettings').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { loadSettingsFile(r.result, f.name); $('setup').classList.remove('on'); };
  r.readAsText(f); e.target.value = '';
});
$('setup').addEventListener('click', e => { if (e.target === $('setup')) $('setup').classList.remove('on'); });

/* keyboard: space or enter draws, escape closes the panel */
addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    $('setup').classList.remove('on');
    $('sponsorPicker').classList.remove('on');
    $('winnersPanel').classList.remove('on');
  }
  if ($('sponsorPicker').classList.contains('on')) return;
  if ($('winnersPanel').classList.contains('on')) return;
  if ($('setup').classList.contains('on')) return;
  if (e.key === 'ArrowRight' && !state.busy)
    return switchSponsor((CONFIG.activeSponsor + 1) % CONFIG.sponsors.length);
  if (e.key === 'ArrowLeft' && !state.busy)
    return switchSponsor((CONFIG.activeSponsor - 1 + CONFIG.sponsors.length) % CONFIG.sponsors.length);
  if ((e.code === 'Space' || e.code === 'Enter') && !/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName)){
    e.preventDefault();
    if (!$('drawBtn').disabled) draw();
  }
});

/* go */
applyLook();
setUpPanels();
Confetti.init();
recallSettings();
hydrateStaticText();
render();
</script>
