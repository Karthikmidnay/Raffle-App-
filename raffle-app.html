}

  --display:#16171A; --glow:rgba(198,143,20,.18); --rule:rgba(0,0,0,.22);

/* ==================================================================
   LOOK LAYER — set from the "Themes & designs" panel.
   Fonts, layout variant, background image and colour overrides all
   ride on top of whichever theme is active.
   ================================================================== */
body{--f-disp:'Anton',Impact,sans-serif; --f-body:'Archivo',system-ui,sans-serif}


/* background image sits under everything, dimmed so type stays readable */
.bgimg{position:fixed;inset:0;z-index:0;pointer-events:none;background-size:cover;
  background-position:center;background-repeat:no-repeat;display:none}
body[data-bgimg="on"] .bgimg{display:block}
body[data-bgimg="on"] .bgimg::after{content:'';position:absolute;inset:0;
  background:var(--bg);opacity:var(--bg-dim,.55)}
body[data-bgimg="on"] .frame,body[data-bgimg="on"] .rail,body[data-bgimg="on"] .ops{position:relative;z-index:2}

/* ---------- design: rail ---------- */
body[data-design="rail"] .stage{
  display:grid;grid-template-columns:minmax(250px,32%) 1fr;
  gap:0 clamp(20px,3vw,52px);align-items:center;text-align:left;
  padding:clamp(14px,2.4vh,34px) clamp(20px,3vw,46px)}
body[data-design="rail"] .sponsorbar,
body[data-design="rail"] .eventline,
body[data-design="rail"] .sponsor,
body[data-design="rail"] .desc,
body[data-design="rail"] .prize,
body[data-design="rail"] .actions{grid-column:1;justify-self:start;margin-left:0;margin-right:0}
body[data-design="rail"] .arena{grid-column:2;grid-row:1/-1;text-align:center}
body[data-design="rail"] .sponsor{margin-top:clamp(8px,1.6vh,20px)}
body[data-design="rail"] .prize{width:100%}
body[data-design="rail"] .eventlogo,
body[data-design="band"] .eventlogo{height:clamp(44px,8vh,104px);
  left:auto;right:clamp(16px,1.8vw,30px)}

/* ---------- design: minimal ---------- */
body[data-design="minimal"] .bulbs,
body[data-design="minimal"] .orb{display:none}
body[data-design="minimal"] .frame{border-color:transparent}
body[data-design="minimal"] .prize{background:transparent;border-color:transparent;
  border-top:2px solid var(--line);border-radius:0}
body[data-design="minimal"] .sponsorbar{background:transparent;border-color:transparent;padding-left:0;padding-right:0}
body[data-design="minimal"] #drawBtn{background:transparent;color:var(--accent);
  border:2px solid var(--accent);box-shadow:none;animation:none}

/* ---------- design: poster ---------- */
body[data-design="poster"] .orb{display:none}
body[data-design="poster"] .sponsor h1{font-size:clamp(30px,min(6vw,11vh),132px)}
body[data-design="poster"] #bigName{font-size:clamp(30px,min(11vw,17vh),190px)}
body[data-design="poster"] .prize{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
body[data-design="poster"] .prize span{color:var(--on-accent);opacity:.72}

/* ---------- design: focus — the name and almost nothing else ---------- */
body[data-design="focus"] .orb,
body[data-design="focus"] .bulbs,
body[data-design="focus"] .desc{display:none}
body[data-design="focus"] .sponsorbar{background:transparent;border-color:transparent;padding:0;transform:scale(.86)}
body[data-design="focus"] .sponsor h1{font-size:clamp(16px,min(2vw,3.4vh),30px);opacity:.7;letter-spacing:.06em}
body[data-design="focus"] #bigName{font-size:clamp(34px,min(12vw,19vh),210px)}
body[data-design="focus"] .prize{background:transparent;border-color:transparent;padding-top:0}
body[data-design="focus"] .prize p{font-size:clamp(14px,min(1.6vw,2.4vh),22px);opacity:.8}

/* ---------- design: band — prize as a full-bleed strip ---------- */
body[data-design="band"] .stage{padding-bottom:0;text-align:left;align-items:stretch}
body[data-design="band"] .sponsorbar,
body[data-design="band"] .sponsor,
body[data-design="band"] .actions{align-self:flex-start;margin-left:0}
body[data-design="band"] .arena{align-items:flex-start;text-align:left}
body[data-design="band"] .namebox{align-items:flex-start}
body[data-design="band"] .prize{
  width:calc(100% + 2 * clamp(18px,3vw,44px));margin:0 clamp(-44px,-3vw,-18px);
  border-radius:0;border:0;border-top:3px solid var(--accent);
  background:var(--accent);color:var(--on-accent);padding:clamp(14px,2vh,26px) clamp(18px,3vw,44px);
  justify-content:flex-start;order:9}
body[data-design="band"] .prize span{color:var(--on-accent);opacity:.7}

/* ---------- design: card — the stage floats on a panel ---------- */
body[data-design="card"] .frame{border:0;background:transparent}
body[data-design="card"] .bulbs{display:none}
body[data-design="card"] .stage{
  margin:clamp(10px,2vh,26px) clamp(14px,3vw,50px);border-radius:22px;
  background:var(--panel);border:1px solid var(--line);
  box-shadow:0 24px 60px rgba(0,0,0,.28);padding:clamp(16px,2.6vh,34px) clamp(20px,3vw,46px)}
body[data-design="card"] .prize{background:var(--bg)}

/* ---------- design: ticket — perforated stub down the left ---------- */
body[data-design="ticket"] .bulbs{display:none}
body[data-design="ticket"] .frame{border-radius:6px}
body[data-design="ticket"] .stage{position:relative;padding-left:clamp(46px,5vw,86px)}
body[data-design="ticket"] .stage::before{
  content:'';position:absolute;left:clamp(22px,2.4vw,42px);top:6%;bottom:6%;width:2px;
  background-image:radial-gradient(circle at 1px 5px,var(--line) 1.8px,transparent 2px);
  background-size:2px 15px}
body[data-design="ticket"] .prize{border-style:dashed}
body[data-design="ticket"] #drawBtn{border-radius:4px}

/* ---------- winner reveal styles ---------- */
#bigName.st-slot{transition:transform .06s linear}
#bigName.st-punch{transition:transform .05s ease-out}
#bigName.st-reel{animation:reelUp .09s linear}
@keyframes reelUp{from{transform:translateY(38%);opacity:.2}to{transform:none;opacity:1}}
#bigName.st-glitch{transition:none}
#bigName.st-curtain{
  --wipe:50%;
  -webkit-mask-image:linear-gradient(90deg,transparent calc(var(--wipe) - 9%),#000 var(--wipe),transparent calc(var(--wipe) + 9%));
  mask-image:linear-gradient(90deg,transparent calc(var(--wipe) - 9%),#000 var(--wipe),transparent calc(var(--wipe) + 9%));
}
#bigName.st-wipe{animation:curtainOpen .75s cubic-bezier(.2,.85,.25,1)}
@keyframes curtainOpen{
  from{-webkit-mask-image:linear-gradient(90deg,transparent 41%,#000 50%,transparent 59%);
       mask-image:linear-gradient(90deg,transparent 41%,#000 50%,transparent 59%)}
  to{-webkit-mask-image:linear-gradient(90deg,#000 0,#000 100%);
     mask-image:linear-gradient(90deg,#000 0,#000 100%)}
}
#bigName.st-locked{animation:lockIn .3s ease-out}
@keyframes lockIn{from{letter-spacing:.06em;opacity:.7}to{letter-spacing:.005em;opacity:1}}
#bigName.st-fade{transition:opacity .12s linear}

/* ---------- sponsor selector, its own band under the stage ---------- */
.sponsorrail{border-bottom:1px solid var(--line);padding-bottom:12px}
.sponsorrail .stab{
  font-size:14px;padding:9px 16px;border-radius:999px;
  display:inline-flex;align-items:center;gap:9px}
.sponsorrail .stab small{font-size:11.5px;opacity:.75;font-weight:500}
.sponsorrail .stab[aria-selected="true"] small{opacity:.85}
.railhint{font-size:12px;color:var(--dim);margin-left:2px}

/* ==================================================================
   PANEL MODES — every dialog can be pushed to the side, shrunk to its
   title bar, or dragged, so the stage stays visible while you edit.
   ================================================================== */
.panelbar{display:flex;align-items:center;gap:6px;position:absolute;top:10px;right:12px;z-index:3}
.panelbar button{
  font:inherit;font-size:11.5px;font-weight:600;background:transparent;
  border:1px solid var(--line);color:var(--dim);border-radius:5px;
  padding:5px 9px;cursor:pointer;white-space:nowrap}
.panelbar button:hover{color:var(--text);border-color:var(--dim)}
.card{position:relative}
.card h3{padding-right:190px}

/* docked: no scrim, stage clickable, panel down one side */
.setup.docked{background:transparent;pointer-events:none;
  align-items:stretch;justify-content:flex-end;padding:10px}
.setup.docked .card{
  pointer-events:auto;width:min(430px,94vw)!important;max-height:none;height:100%;
  box-shadow:0 18px 50px rgba(0,0,0,.45)}
.setup.docked.left{justify-content:flex-start}

/* minimised: just the bar, parked in a corner */
.setup.min{background:transparent;pointer-events:none;align-items:flex-end;justify-content:flex-end;padding:12px}
.setup.min .card{
  pointer-events:auto;width:auto!important;min-width:250px;height:auto;max-height:none;
  padding:12px 14px;overflow:visible}
.setup.min .card > *{display:none}
.setup.min .card > h3{display:block;font-size:15px;padding-right:150px;margin:0}
.setup.min .card > .panelbar{display:flex;position:static;margin-left:auto}
.setup.min .card{display:flex;align-items:center;gap:12px}

.dragging{cursor:grabbing;user-select:none}
.setup.docked .card h3,.setup.min .card h3{cursor:grab}

/* ---------- per-sponsor background controls ---------- */
.sbg{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 0}
.sbgbtn{font-size:12px;padding:7px 11px;cursor:pointer;position:relative;overflow:hidden}
.sbgbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.sbgprev{height:54px;border-radius:6px;margin-top:8px;border:1px solid var(--line);
  background-size:cover;background-position:center}

/* ---------- winners list: one detail block per winner ---------- */
.wdet{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:6px 0 12px;font-size:13px}
.wdet dt{color:var(--dim);white-space:nowrap}
.wdet dd{margin:0;color:var(--text);word-break:break-word}
#winnersBody li{margin-bottom:10px}
#winnersBody li b{font-size:15.5px}

/* ---------- themes & designs panel ---------- */
.looks h4{margin:22px 0 10px;font-size:11px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--dim)}
.looks h4:first-child{margin-top:0}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{font:inherit;font-size:13px;font-weight:600;cursor:pointer;
  border:1px solid var(--line);border-radius:7px;padding:9px 13px;
  background:var(--panel);color:var(--text);display:flex;align-items:center;gap:8px}
.swatches button i{width:15px;height:15px;border-radius:4px;display:block;border:1px solid rgba(128,128,128,.4)}
.swatches button[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.looks .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.looks .fieldrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.looks input[type=color]{width:56px;height:38px;padding:2px;border:1px solid var(--line);
  border-radius:7px;background:var(--panel);cursor:pointer}
.looks input[type=range]{flex:1;min-width:150px}
.credit{font-size:12px;color:var(--dim);letter-spacing:.02em;white-space:nowrap}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:'Archivo',system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  transition:background .5s ease;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(62% 46% at 50% 16%,var(--glow),transparent 66%);
  transition:opacity .5s;
}
body.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{
  10%,90%{transform:translate(-2px,1px)} 20%,80%{transform:translate(4px,-2px)}
  30%,50%,70%{transform:translate(-7px,2px)} 40%,60%{transform:translate(7px,-1px)}
}

/* ---------- marquee bulb frame ---------- */
.frame{
  position:relative;flex:1;min-height:0;margin:clamp(8px,1.1vw,16px);
  border-radius:10px;border:1px solid var(--line);
  display:flex;flex-direction:column;overflow:hidden;z-index:1;
}
.bulbs{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:.5}
.bulbs i{
  position:absolute;background-repeat:repeat;
  background-image:radial-gradient(circle,var(--accent) 1.6px,transparent 2.5px);
  animation:chase 1.05s steps(2,end) infinite;
}
.bulbs .t,.bulbs .b{left:0;right:0;height:14px;background-size:26px 14px;background-position:0 center}
.bulbs .t{top:0} .bulbs .b{bottom:0}
.bulbs .l,.bulbs .r{top:0;bottom:0;width:14px;background-size:14px 26px;background-position:center 0}
.bulbs .l{left:0} .bulbs .r{right:0}
@keyframes chase{from{background-position-x:0;opacity:1}to{background-position-x:13px;opacity:.72}}
.bulbs .l,.bulbs .r{animation-name:chaseY}
@keyframes chaseY{from{background-position-y:0;opacity:.72}to{background-position-y:13px;opacity:1}}

/* ---------- stage ---------- */
.eventlogo{
  position:absolute;top:clamp(12px,2vh,26px);left:clamp(16px,1.8vw,30px);
  height:clamp(62px,13vh,180px);width:auto;z-index:5;pointer-events:none;
}
.stage{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  padding:clamp(12px,1.8vh,30px) clamp(18px,3vw,44px);gap:clamp(6px,1.1vh,16px);
  text-align:center;position:relative;z-index:2;
}
/* Sample C: no container. A small label above, the lockup sitting on a
   hairline rule, everything else transparent. */
.sponsorbar{cursor:pointer;display:flex;flex-direction:column;align-items:center;
  gap:clamp(5px,0.9vh,10px);background:transparent;border:0;padding:0}
.sponsorbar-lock{display:flex;align-items:center;justify-content:center;
  gap:clamp(11px,1.3vw,18px);padding-bottom:clamp(7px,1vh,13px);
  border-bottom:2px solid var(--rule)}
.sponsor-prefix{font-size:clamp(11px,1.05vw,15px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.sponsor-name{font-size:clamp(20px,min(2.9vw,4.3vh),42px);font-weight:700;letter-spacing:-.015em;color:var(--text)}
.eventline{font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}

.sponsor{display:flex;align-items:center;gap:clamp(12px,1.6vw,20px);justify-content:center;flex-wrap:wrap;
  margin-top:clamp(6px,1.9vh,34px)}
.sponsorbar .logo{
  width:clamp(52px,min(6.6vw,9vh),104px);height:clamp(52px,min(6.6vw,9vh),104px);flex:none;
  display:grid;place-items:center;border-radius:8px;overflow:hidden;
  background:transparent;border:0;
}
/* A logo only gets a plate when it would otherwise disappear into the
   background — a dark mark on the dark theme, or a pale one on the light. */
.logo.plated-light,.scard .mk.plated-light{background:#F4F4F2;border:1px solid rgba(0,0,0,.1);padding:6%}
.logo.plated-dark,.scard .mk.plated-dark{background:#17191C;border:1px solid rgba(255,255,255,.12);padding:6%}
.sponsorbar .logo img{width:100%;height:100%;object-fit:contain;display:block}
.sponsorbar .logo svg{width:62%;height:62%;color:var(--accent)}
.sponsor .txt{text-align:left}
.sponsor h1{
  font-family:'Anton',Impact,sans-serif;text-transform:uppercase;margin:0;line-height:.9;
  font-size:clamp(26px,min(4.4vw,6.6vh),72px);letter-spacing:.005em;color:var(--text);
}
.desc{font-size:clamp(15px,1.45vw,21px);line-height:1.5;color:var(--dim);max-width:58ch;margin:0 auto}
.sponsor .tag{font-size:clamp(13px,1.3vw,18px);font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:8px}
.sponsor .desc{font-size:14px;line-height:1.5;color:var(--dim);max-width:56ch;margin:8px auto 0}

/* ---------- the orb ---------- */
.arena{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.2vw,16px);width:100%;position:relative}
.orb{
  width:clamp(64px,10vh,200px);aspect-ratio:1;position:relative;flex:none;
  transition:width .6s cubic-bezier(.2,.9,.25,1),opacity .5s,transform .6s cubic-bezier(.2,.9,.25,1);
}
.orb svg{width:100%;height:100%;display:block;overflow:visible}
.orb .orbit{transform-origin:60px 60px;animation:roll 18s linear infinite}
.orb .orbit.two{animation-duration:26s;animation-direction:reverse}
.orb .ring{stroke-dasharray:5 9;animation:dash 20s linear infinite}
.orb .core{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}
.orb .halo{fill:none;stroke:var(--accent);stroke-width:2;opacity:.5}
.orb.fast .orbit{animation-duration:.85s}
.orb.fast .orbit.two{animation-duration:1.3s}
.orb.fast .ring{animation-duration:2s}
.orb.fast .core{animation-duration:.5s}
@keyframes roll{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-280}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.88}50%{transform:scale(1.2);opacity:1}}
.arena.revealed .orb{width:clamp(80px,9.5vh,116px);opacity:.55;transform:translateY(-4px)}

/* idle: the pool count is the hero, not a prompt repeating the button */


.poolline{font-size:13.5px;color:var(--dim);letter-spacing:.02em;margin-top:4px}
.poolline b{color:var(--text);font-variant-numeric:tabular-nums}
.poolline b.bump{animation:bump .5s cubic-bezier(.2,1.4,.3,1)}
.arena.idle #bigName,.arena.idle .meta{display:none}
@keyframes bump{0%{transform:scale(1.32)}100%{transform:scale(1)}}

/* ---------- name display ---------- */
.namebox{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(2px,.5vh,6px);min-height:0}
#bigName{
  font-family:'Anton',Impact,sans-serif;text-transform:uppercase;margin:0;line-height:.88;
  font-size:clamp(28px,min(9.6vw,12.5vh),148px);letter-spacing:.005em;word-break:break-word;color:var(--display);
}
#bigName.rolling{color:var(--dim);opacity:.9;will-change:filter,transform}
#bigName.slam{animation:slam .55s cubic-bezier(.15,1.5,.35,1)}
@keyframes slam{0%{transform:scale(1.7) rotate(-2.5deg);opacity:0;filter:blur(9px)}
  60%{transform:scale(.97) rotate(.6deg);opacity:1;filter:blur(0)}100%{transform:none}}

.meta:empty{min-height:0}
.meta{min-height:1.4em;font-size:clamp(13px,min(1.35vw,1.9vh),19px);font-weight:500;
  letter-spacing:.01em;color:var(--dim);opacity:0;transition:opacity .35s .25s}
.meta.on{opacity:1}
.meta .co{color:var(--text);font-weight:600}
.meta .tk{color:var(--accent);font-weight:700;letter-spacing:.05em;font-variant-numeric:tabular-nums}

/* ---------- prize band + button ---------- */
.prize{
  width:min(1040px,100%);border-radius:10px;
  padding:clamp(14px,1.9vh,28px) clamp(20px,2.4vw,36px);
  background:var(--panel);border:1px solid var(--line);
  display:flex;gap:16px;align-items:baseline;justify-content:center;flex-wrap:wrap;
}
.prize span{font-size:clamp(12px,1.15vw,16px);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);flex:none}
.prize p{margin:0;font-size:clamp(18px,min(2.7vw,3.9vh),38px);font-weight:600;line-height:1.25}

.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
#drawBtn{
  font-family:'Anton',Impact,sans-serif;font-size:clamp(19px,2.3vw,29px);letter-spacing:.05em;
  text-transform:uppercase;color:var(--on-accent);border:0;border-radius:6px;
  padding:clamp(14px,1.5vw,19px) clamp(38px,4.6vw,72px);cursor:pointer;position:relative;
  background:var(--accent);
  box-shadow:0 0 0 0 var(--glow);
  transition:transform .12s,box-shadow .2s,filter .2s;
  animation:breathe 2.6s ease-in-out infinite;
}
#drawBtn:hover:not(:disabled){filter:brightness(1.08)}
#drawBtn:active:not(:disabled){transform:translateY(2px)}
#drawBtn:disabled{animation:none;background:var(--panel);color:var(--dim);border:1px solid var(--line);cursor:not-allowed}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 var(--glow)}50%{box-shadow:0 0 32px 6px var(--glow)}}
.ghost{
  font:inherit;font-size:14px;font-weight:600;color:var(--text);background:transparent;
  border:1px solid var(--line);border-radius:6px;padding:13px 22px;cursor:pointer;
  transition:border-color .15s;
}
.ghost:hover{border-color:var(--dim)}
:focus-visible{outline:3px solid var(--dim);outline-offset:3px}

/* ---------- winners rail ---------- */
.rail{
  z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:10px clamp(14px,2vw,26px);margin:0 clamp(8px,1.1vw,16px);
}
.rail h2{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:0;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.chip{
  display:flex;align-items:center;gap:9px;background:var(--panel);
  border:1px solid var(--line);border-radius:6px;padding:6px 13px 6px 7px;font-size:13.5px;
  animation:chipin .45s cubic-bezier(.2,1.2,.3,1);
}
@keyframes chipin{from{opacity:0;transform:translateY(10px) scale(.9)}to{opacity:1;transform:none}}
.chip i{width:21px;height:21px;border-radius:4px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12px;flex:none}
.chip b{font-weight:600}
.chip small{color:var(--dim);font-size:12px}
.rail .none{font-size:13.5px;color:var(--dim)}

/* ---------- ops bar ---------- */
.ops{
  z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px clamp(14px,2vw,26px);font-size:12.5px;color:var(--dim);
  border-top:1px solid var(--line);
}
.ops .sep{width:1px;height:18px;background:var(--line)}
.sponsor-tabs{display:flex;gap:5px;flex-wrap:wrap}
.wgroup{margin-bottom:20px}
.wgroup h5{margin:0 0 3px;font-size:14px;font-weight:700}
.wgroup .wsub{font-size:12px;color:var(--dim);margin-bottom:9px}
.wgroup ol{margin:0;padding-left:26px}
.wgroup li{font-size:15px;line-height:1.85;padding-left:4px}
.wgroup li span{color:var(--dim);font-size:13px}
.wgroup li.gone{color:var(--dim);text-decoration:line-through}
.wgroup .none{font-size:14px;color:var(--dim);margin:0}
.sponsor-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.scard{border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:10px;
  background:var(--bg)}
.scard.live{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.scard .top{display:flex;align-items:center;gap:11px}
.scard .mk{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:7px;
  background:transparent;border:0;overflow:hidden}
.scard .mk img{width:100%;height:100%;object-fit:contain;display:block}
.scard .mk svg{width:62%;height:62%;color:var(--accent)}
.scard h4{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
.scard .tg{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-top:3px}
.scard .pz{font-size:14px;line-height:1.45;color:var(--text);margin:0}
.scard .pr{display:flex;gap:5px}
.scard .pip{flex:1;height:5px;border-radius:3px;background:var(--panel);border:1px solid var(--line)}
.scard .pip.on{background:var(--accent);border-color:var(--accent)}
.scard .ct{font-size:12.5px;color:var(--dim)}
.scard ol{margin:0;padding-left:18px;font-size:12.5px;line-height:1.7;color:var(--dim)}
.scard ol b{color:var(--text);font-weight:600}
.scard .use{margin-top:auto;font:inherit;font-size:14px;font-weight:600;border-radius:6px;padding:11px 14px;
  cursor:pointer;background:var(--accent);color:var(--on-accent);border:0}
.scard .use[disabled]{background:transparent;border:1px solid var(--line);color:var(--dim);cursor:default}
.stab{font:inherit;font-size:12.5px;font-weight:600;background:transparent;
  border:1px solid var(--line);color:var(--dim);border-radius:5px;padding:7px 12px;cursor:pointer;
  transition:color .15s,border-color .15s}
.stab:hover{color:var(--text);border-color:var(--dim)}
.stab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stab[data-done="1"][aria-selected="false"]{opacity:.5}
.ops button,.ops label.file{
  font:inherit;font-size:12.5px;background:transparent;border:1px solid var(--line);
  color:var(--dim);border-radius:5px;padding:7px 12px;cursor:pointer;transition:color .15s,border-color .15s;
}
.ops button:hover,.ops label.file:hover{color:var(--text);border-color:var(--dim)}
.ops button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.ops label.file input{position:absolute;width:1px;height:1px;opacity:0}
.ops .status{margin-left:auto;display:flex;gap:14px;align-items:center}
.ops .status .ok{color:var(--dim)}
.ops .status .bad{color:var(--text);font-weight:600}

/* ---------- countdown ---------- */
.countdown{
  position:fixed;inset:0;display:grid;place-items:center;z-index:40;pointer-events:none;
  font-family:'Anton',Impact,sans-serif;font-size:clamp(120px,26vw,380px);line-height:1;
  color:var(--accent);opacity:0;
}
.countdown.on{animation:cd .68s cubic-bezier(.2,1.1,.3,1) forwards}
body.counting .stage{opacity:.15;filter:blur(1px)}
.stage{transition:opacity .3s ease,filter .3s ease}
@keyframes cd{0%{opacity:0;transform:scale(2.2)}18%{opacity:1;transform:scale(1)}
  82%{opacity:1;transform:scale(1.02)}100%{opacity:0;transform:scale(.7)}}

/* ---------- sweep + confetti ---------- */
.sweep{position:fixed;inset:0;pointer-events:none;z-index:35;opacity:0}
.sweep.on{animation:sweep .9s ease-out}
@keyframes sweep{
  0%{opacity:0;background:linear-gradient(105deg,transparent 0%,var(--accent-soft) 8%,transparent 16%)}
  30%{opacity:1}
  100%{opacity:0;background:linear-gradient(105deg,transparent 84%,var(--accent-soft) 92%,transparent 100%)}
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:38}

/* ---------- setup panel ---------- */
.setup{
  position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;
  align-items:center;justify-content:center;padding:20px;
}
.setup.on{display:flex}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:10px;
  width:min(620px,100%);max-height:88vh;overflow:auto;padding:clamp(20px,2.4vw,30px);
}
.card h3{margin:0 0 4px;font-family:'Anton',sans-serif;font-size:26px;text-transform:uppercase;letter-spacing:.02em}
.card .hint{margin:0 0 20px;font-size:13.5px;color:var(--dim);line-height:1.55}
.field{margin-bottom:15px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;font:inherit;font-size:14.5px;color:var(--text);background:var(--bg);
  border:1px solid var(--line);border-radius:6px;padding:11px 13px;
}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field input[type=number]{max-width:130px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.card .primary{
  font:inherit;font-size:15px;font-weight:700;background:var(--accent);color:var(--on-accent);
  border:0;border-radius:6px;padding:13px 26px;cursor:pointer;
}
.card .primary:hover{filter:brightness(1.07)}

.dropzone{position:fixed;inset:0;z-index:60;display:none;place-items:center;
  background:rgba(0,0,0,.85);font-family:'Anton',sans-serif;font-size:clamp(24px,4vw,52px);
  text-transform:uppercase;color:var(--accent);text-align:center;padding:24px}
.dropzone.on{display:grid}

@media (max-width:820px){
  html,body{height:auto;min-height:100%}
  body{overflow:visible}
  .eventlogo{position:static;height:84px;margin:16px auto 0;display:block}
  .stage{padding:14px 16px 20px}
  .sponsor .txt{text-align:center}
  .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  #drawBtn,.bulbs i,.orb .orbit,.orb .core,.orb .ring{animation:none!important}
  #bigName.slam,.chip{animation:none}
  body.shake{animation:none}
}

/* Font overrides last, so they beat the family names hard-coded above. */
body,.ops,.card,.rail{font-family:var(--f-body)}
#bigName,.sponsor h1,#drawBtn,.countdown,.card h3,.dropzone{font-family:var(--f-disp)}
</style>
</head>
<body data-theme="ink" data-design="classic">

<div class="bgimg" id="bgImg"></div>

<div class="frame">
  <div class="bulbs" aria-hidden="true"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i></div>

  <img class="eventlogo" id="eventLogo" alt="" aria-hidden="true">

  <div class="stage">
    <div class="sponsorbar" id="sponsorBar" title="Switch sponsor">
      <span class="sponsor-prefix" data-text="sponsorPrefix"></span>
      <div class="sponsorbar-lock">
        <div class="logo" id="logo"></div>
        <span class="sponsor-name" id="spName"></span>
      </div>
    </div>

    <div class="eventline" id="eventLine"></div>

    <div class="sponsor">
      <div class="txt">
        <h1 id="spTitle"></h1>
        <div class="tag" id="spTag"></div>
      </div>
    </div>
    <p class="desc" id="spDesc"></p>

    <div class="arena idle" id="arena">
      <div class="orb" id="orb">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring" cx="60" cy="60" r="50" fill="none" stroke="var(--dim)" stroke-width="1.8" opacity=".6"/>
          <circle cx="60" cy="60" r="34" fill="none" stroke="var(--line)" stroke-width="1.2"/>
          <g class="orbit">
            <rect x="53" y="4" width="14" height="9" rx="1.6" fill="var(--accent)"/>
            <rect x="98" y="42" width="14" height="9" rx="2" fill="var(--text)" opacity=".75" transform="rotate(72 105 46)"/>
            <rect x="84" y="94" width="14" height="9" rx="1.6" fill="var(--accent)" transform="rotate(144 91 98)"/>
            <rect x="22" y="94" width="14" height="9" rx="2" fill="var(--text)" opacity=".75" transform="rotate(216 29 98)"/>
            <rect x="8" y="42" width="14" height="9" rx="1.6" fill="var(--dim)" transform="rotate(288 15 46)"/>
          </g>
          <g class="orbit two">
            <rect x="53" y="22" width="12" height="8" rx="2" fill="var(--dim)"/>
            <rect x="80" y="66" width="12" height="8" rx="2" fill="var(--dim)" transform="rotate(120 86 70)"/>
            <rect x="28" y="66" width="12" height="8" rx="2" fill="var(--dim)" transform="rotate(240 34 70)"/>
          </g>
          <circle class="core" cx="60" cy="60" r="15" fill="var(--accent)" opacity=".9"/>
          
        </svg>
      </div>

      <div class="namebox">
        <p id="bigName"></p>
        <div class="meta" id="meta"></div>
        <div class="poolline" id="poolLine"></div>
      </div>
    </div>

    <div class="prize"><span data-text="prizeLabel"></span><p id="spOffer"></p></div>

    <div class="actions">
      <button id="drawBtn"></button>
      <button class="ghost" id="undoBtn" data-text="absentBtn" hidden></button>
    </div>
  </div>
</div>

<div class="rail sponsorrail" id="sponsorRail">
  <h2 data-text="sponsorRailHeading"></h2>
  <div class="chips" id="sponsorPills"></div>
</div>

<div class="rail">
  <h2 data-text="winnersHeading"></h2>
  <div class="chips" id="chips"></div>
</div>

<footer class="ops">
  <label class="file"><span data-text="opsImport"></span><input type="file" id="csv" accept=".csv,text/csv"></label>
  <button id="sponsorsBtn" data-text="opsSponsors"></button>
  <button id="setupBtn" data-text="opsSetup"></button>
  <button id="winnersBtn" data-text="opsWinners"></button>
  <button id="looksBtn" data-text="opsLooks"></button>
  <button id="wipeBtn" data-text="opsWipe"></button>
  <div class="sep"></div>
  <button id="soundBtn" aria-pressed="true"></button>
  <button id="cdBtn" aria-pressed="true"></button>
  <button id="themeBtn" data-text="opsTheme"></button>
  <button id="fsBtn" data-text="opsFullscreen" title="Hide the browser tabs and address bar so only the draw is on the projector. Press Esc or click again to come back."></button>
  <div class="sep"></div>
  <button id="resetBtn" data-text="opsClear"></button>
  <div class="status"><span id="status"></span>
    <span class="sep"></span>
    <span class="credit" data-text="credit"></span>
  </div>
</footer>

<div class="countdown" id="countdown" aria-hidden="true"></div>
<div class="sweep" id="sweep" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="dropzone" id="dropzone" data-text="dropzone"></div>

<!-- ================= setup ================= -->

</div>

    <div class="swatches" id="designSwatches"></div>

    <h4 data-text="looksWinnerStyle"></h4>

    <h4 data-text="looksColors"></h4>
    <div class="two">
      <div class="field">
        <label for="cAccent" data-text="labelAccent"></label>
        <div class="fieldrow">
          <input type="color" id="cAccent">
          <button class="ghost" id="cAccentReset" data-text="looksReset" style="padding:9px 14px"></button>
        </div>
      </div>
      <div class="field">
        <label for="cBg" data-text="labelBg"></label>
        <div class="fieldrow">
          <input type="color" id="cBg">
          <button class="ghost" id="cBgReset" data-text="looksReset" style="padding:9px 14px"></button>
        </div>
      </div>
    </div>

    <h4 data-text="looksFonts"></h4>
    <div class="two">
      <div class="field"><label for="fDisp" data-text="labelFontDisplay"></label><select id="fDisp"></select></div>
      <div class="field"><label for="fBody" data-text="labelFontBody"></label><select id="fBody"></select></div>
    </div>

    <h4 data-text="looksEventLogo"></h4>
    <p class="hint" data-text="labelEventLogoHint"></p>
    <div class="field">

/* ==================================================================
   LOGO PREPARATION

   Sponsor logos arrive as PNGs with a baked-in white (or black) rectangle,
   which shows as an ugly tile on a dark screen. This clears it by flood
   filling inwards from the edges, so only the background that actually
   touches the border is removed — white *inside* the mark survives.

   It also measures how light or dark the remaining artwork is, so the app
   can decide whether that logo needs a plate behind it to stay visible.
   ================================================================== */
function processLogo(src){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const cap = 360, sc = Math.min(1, cap / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * sc));
      const h = Math.max(1, Math.round(img.height * sc));
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const cx = cv.getContext('2d', { willReadFrequently: true });
      cx.drawImage(img, 0, 0, w, h);

      let data;
      try { data = cx.getImageData(0, 0, w, h); }
      catch (err) { return resolve({ url: src, lum: 0.5 }); }
      const px = data.data;

      // Only strip if the corners agree on a colour — otherwise the artwork
      // probably runs to the edge and there is no background to remove.
      const corner = i => [px[i], px[i+1], px[i+2], px[i+3]];
      const cs = [0, (w-1)*4, (h-1)*w*4, ((h-1)*w + w-1)*4].map(corner);
      const same = cs.every(c => Math.abs(c[0]-cs[0][0]) < 18 &&
                                 Math.abs(c[1]-cs[0][1]) < 18 &&
                                 Math.abs(c[2]-cs[0][2]) < 18);
      if (same && cs[0][3] > 8){
        const base = cs[0];
        const seen = new Uint8Array(w * h);
        const stack = [];
        for (let x = 0; x < w; x++){ stack.push(x, 0, x, h - 1); }
        for (let y = 0; y < h; y++){ stack.push(0, y, w - 1, y); }
        while (stack.length){
          const y = stack.pop(), x = stack.pop();
          if (x < 0 || y < 0 || x >= w || y >= h) continue;
          const p = y * w + x;
          if (seen[p]) continue;
          const i = p * 4;
          if (px[i+3] === 0){ seen[p] = 1; continue; }
          if (Math.abs(px[i]-base[0]) > 30 ||
              Math.abs(px[i+1]-base[1]) > 30 ||
              Math.abs(px[i+2]-base[2]) > 30) continue;
          seen[p] = 1; px[i+3] = 0;
          stack.push(x+1, y, x-1, y, x, y+1, x, y-1);
        }
        cx.putImageData(data, 0, 0);
      }

      let sum = 0, count = 0;
      for (let i = 0; i < px.length; i += 4){
        if (px[i+3] > 40){
          sum += (0.2126*px[i] + 0.7152*px[i+1] + 0.0722*px[i+2]) / 255;
          count++;
        }
      }
      resolve({ url: cv.toDataURL('image/png'), lum: count ? sum / count : 0.5 });
    };
    img.onerror = () => resolve({ url: src, lum: 0.5 });
    img.src = src;
  });
}

/* Decide whether this logo needs a plate on the current theme. */
function plateClass(sp){
  if (!sp.logo) return '';
  const lum = typeof sp.logoLum === 'number' ? sp.logoLum : 0.5;
  const darkTheme = document.body.dataset.theme === 'ink';
  if (darkTheme && lum < 0.42) return ' plated-light';
  if (!darkTheme && lum > 0.74) return ' plated-dark';
  return '';
}

   Two independent mechanisms, because they fail in different ways:
   · Automatic — anything saved in the panel is kept by this browser, so
     the file opens ready next time. Lost if browser data is cleared, or
     if you open the file on a different machine.
   · Settings file — "Save settings file" downloads a small .json to keep
     beside the HTML. Drop it on the window to restore it anywhere.
   ================================================================== */
const SETTINGS_KEY = 'wpfuture-raffle-settings-v1';

function currentSettings(){
  return {
    version: 2,
    event: CONFIG.event, title: CONFIG.title, eyebrow: CONFIG.eyebrow,
    activeSponsor: CONFIG.activeSponsor,
    eventLogo: CONFIG.eventLogo,
    sponsors: CONFIG.sponsors.map(s => ({
      id: s.id, name: s.name, tagline: s.tagline, description: s.description,
      offer: s.offer, winnerCount: s.winnerCount, logo: s.logo, logoLum: s.logoLum,
      bg: s.bg || null
    })),
    theme: document.body.dataset.theme,
    look: { ...state.look }
  };
}

function applySettings(d){
  if (!d || typeof d !== 'object') return false;
  if (typeof d.event === 'string')   CONFIG.event = d.event;
  if (typeof d.title === 'string')   CONFIG.title = d.title;
  if (typeof d.eyebrow === 'string') CONFIG.eyebrow = d.eyebrow;
  if (typeof d.eventLogo === 'string' || d.eventLogo === null) CONFIG.eventLogo = d.eventLogo;
  // Also accept a settings file saved by the multi-sponsor build: take its
  // first sponsor, so an old file does not silently fail to load.
  const s = d.sponsor || (Array.isArray(d.sponsors) && d.sponsors[0]) || {};
  // v2 stores a list; v1 stored a single sponsor. Accept both.
  const list = Array.isArray(d.sponsors) ? d.sponsors : (d.sponsor ? [d.sponsor] : null);
  if (list && list.length){
    CONFIG.sponsors = list.map((sp, i) => ({
      id:          typeof sp.id === 'string' ? sp.id : 's' + (i + 1),
      name:        typeof sp.name === 'string' ? sp.name : 'Sponsor ' + (i + 1),
      tagline:     typeof sp.tagline === 'string' ? sp.tagline : '',
      description: typeof sp.description === 'string' ? sp.description : '',
      offer:       typeof sp.offer === 'string' ? sp.offer : '',
      winnerCount: Number.isFinite(sp.winnerCount) ? Math.max(1, sp.winnerCount) : 1,
      logo:        typeof sp.logo === 'string' ? sp.logo : null,
      logoLum:     Number.isFinite(sp.logoLum) ? sp.logoLum : undefined,
      bg:          typeof sp.bg === 'string' ? sp.bg : null
    }));
    CONFIG.activeSponsor = Number.isFinite(d.activeSponsor)
      ? Math.min(Math.max(0, d.activeSponsor), CONFIG.sponsors.length - 1) : 0;
  }
  if (d.look && typeof d.look === 'object'){
    const L = state.look;
    if (THEME_LIST.includes(d.look.theme))          L.theme = d.look.theme;
    if (DESIGNS[d.look.design])                     L.design = d.look.design;
    if (WINNER_STYLES[d.look.winnerStyle])          L.winnerStyle = d.look.winnerStyle;
    if (FONTS[d.look.fontDisp])                     L.fontDisp = d.look.fontDisp;
    if (FONTS[d.look.fontBody])                     L.fontBody = d.look.fontBody;
    if (typeof d.look.accent === 'string')          L.accent = d.look.accent;
    if (typeof d.look.bg === 'string')              L.bg = d.look.bg;
    if (typeof d.look.bgImage === 'string' || d.look.bgImage === null) L.bgImage = d.look.bgImage;
    if (Number.isFinite(d.look.bgDim))              L.bgDim = d.look.bgDim;
  } else if (d.theme && THEME_LIST.includes(d.theme)){
    state.look.theme = d.theme;
  }
  applyLook();
  return true;
}

/* Storage can throw — private browsing, blocked cookies, some file://
   configurations. Never let that break the draw; just carry on unsaved. */
function rememberSettings(){
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(currentSettings())); return true; }
  catch(err){ return false; }
}
function recallSettings(){
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    return raw ? applySettings(JSON.parse(raw)) : false;
  } catch(err){ return false; }
}
function forgetSettings(){ try { localStorage.removeItem(SETTINGS_KEY); } catch(err){} }

function downloadSettings(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(currentSettings(), null, 2)],
    {type:'application/json'}));
  a.download = 'raffle-settings.json';
  a.click();
  URL.revokeObjectURL(a.href);
  flash(t('msgSettingsSaved'));
}

function loadSettingsFile(text, label){
  let data;
  try { data = JSON.parse(text); }
  catch(err){ return flash(t('msgSettingsBad'), true); }
  if (!applySettings(data)) return flash(t('msgSettingsBad'), true);
  rememberSettings();
  render();
  flash(t('msgSettingsLoaded', { file: label }));
}

/* Unbiased random index. Rejection sampling, so no modulo skew. */
function randomIndex(n){
  if (n <= 0) return -1;
  const limit = Math.floor(0xFFFFFFFF / n) * n, buf = new Uint32Array(1);
  let v; do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
  return v % n;
}

/* ==================================================================
   5 · SOUND — generated live, no audio files, works offline
   ================================================================== */
const Sound = {
  ctx: null,
  wake(){ if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
  blip(freq, dur = 0.05, type = 'square', gain = 0.05){
    if (!state.sound) return;
    try {
      this.wake();
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(gain, this.ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + dur);
      o.connect(g).connect(this.ctx.destination);
      o.start(); o.stop(this.ctx.currentTime + dur);
    } catch(e){}
  },
  tick(){ this.blip(360 + Math.random()*220, 0.035, 'square', 0.035); },
  beep(n){ this.blip([440,554,659][n] || 440, 0.16, 'triangle', 0.09); },
  fanfare(){
    if (!state.sound) return;
    [523,659,784,1047,1319].forEach((f,i) =>
      setTimeout(() => this.blip(f, 0.42, 'triangle', 0.085), i*95));
    setTimeout(() => this.blip(1568, 0.7, 'sine', 0.07), 520);
  }
};

/* ==================================================================
   6 · CONFETTI
   ================================================================== */
const Confetti = {
  cv: $('confetti'), ctx: null, bits: [], raf: null,
  init(){
    this.ctx = this.cv.getContext('2d');
    const fit = () => {
      const d = window.devicePixelRatio || 1;
      this.cv.width = innerWidth * d; this.cv.height = innerHeight * d;
      this.ctx.setTransform(d,0,0,d,0,0);
    };
    fit(); addEventListener('resize', fit);
  },
  palette(){
    const cs = getComputedStyle(document.body);
    return ['--accent','--text','--dim']
      .map(v => cs.getPropertyValue(v).trim()).filter(Boolean);
  },
  burst(n = 190){
    if (reduceMotion()) return;
    const cols = this.palette();
    const guns = [
      {x: innerWidth*0.06, y: innerHeight*0.94, a: -1.05},
      {x: innerWidth*0.94, y: innerHeight*0.94, a: -2.09},
      {x: innerWidth*0.50, y: innerHeight*0.30, a: -1.57}
    ];
    for (let i = 0; i < n; i++){
      const g = guns[i % guns.length];
      const spread = (Math.random()-0.5) * 0.9;
      const speed = 9 + Math.random()*15;
      this.bits.push({
        x: g.x, y: g.y,
        vx: Math.cos(g.a + spread) * speed,
        vy: Math.sin(g.a + spread) * speed,
        w: 6 + Math.random()*8, h: 9 + Math.random()*11,
        rot: Math.random()*6.3, vr: (Math.random()-0.5)*0.4,
        col: cols[Math.floor(Math.random()*cols.length)],
        life: 1
      });
    }
    if (!this.raf) this.loop();
  },
  loop(){
    this.ctx.clearRect(0,0,innerWidth,innerHeight);
    this.bits = this.bits.filter(b => b.life > 0 && b.y < innerHeight + 80);
    for (const b of this.bits){
      b.vy += 0.34; b.vx *= 0.992; b.vy *= 0.992;
      b.x += b.vx; b.y += b.vy; b.rot += b.vr;
      if (b.y > innerHeight * 0.75) b.life -= 0.014;
      this.ctx.save();
      this.ctx.translate(b.x, b.y); this.ctx.rotate(b.rot);
      this.ctx.globalAlpha = Math.max(0, b.life);
      this.ctx.fillStyle = b.col;
      this.ctx.fillRect(-b.w/2, -b.h/2, b.w, b.h * (0.4 + Math.abs(Math.cos(b.rot))*0.6));
      this.ctx.restore();
    }
    if (this.bits.length) this.raf = requestAnimationFrame(() => this.loop());
    else { this.ctx.clearRect(0,0,innerWidth,innerHeight); this.raf = null; }
  }
};

function applyLook(){
  const L = state.look, b = document.body;
  b.dataset.theme  = L.theme;
  b.dataset.design = L.design;
  state.themeIdx = Math.max(0, state.themes.indexOf(L.theme));

  L.accent ? b.style.setProperty('--accent', L.accent) : b.style.removeProperty('--accent');
  L.bg     ? b.style.setProperty('--bg', L.bg)         : b.style.removeProperty('--bg');
  b.style.setProperty('--f-disp', (FONTS[L.fontDisp] || FONTS.anton).stack);
  b.style.setProperty('--f-body', (FONTS[L.fontBody] || FONTS.archivo).stack);

  const sponsorBg = (CONFIG.sponsors[CONFIG.activeSponsor] || {}).bg;
  const img = sponsorBg || L.bgImage;
  if (img){
    b.dataset.bgimg = 'on';
    $('bgImg').style.backgroundImage = `url(${img})`;
    b.style.setProperty('--bg-dim', (L.bgDim / 100).toFixed(2));

    b.dataset.bgimg = 'off';
    $('bgImg').style.backgroundImage = '';
  }
  if (typeof fitName === 'function') setTimeout(fitName, 60);
}

  row('designSwatches', DESIGNS,        'design');

  const opts = sel => Object.entries(FONTS).map(([k,v]) =>
    `<option value="${k}" style="font-family:${v.stack};font-size:15px"
       ${L[sel]===k?'selected':''}>${esc(v.label)}</option>`).join('');
  $('fDisp').innerHTML = opts('fontDisp');
  $('fBody').innerHTML = opts('fontBody');
  // and the closed select shows the chosen face too
  $('fDisp').style.fontFamily = (FONTS[L.fontDisp] || FONTS.anton).stack;
  $('fBody').style.fontFamily = (FONTS[L.fontBody] || FONTS.archivo).stack;
}

/* Colour inputs need #rrggbb; computed styles may hand back rgb() or a name. */
function rgbToHex(v){
  v = (v || '').trim();
  if (/^#[0-9a-f]{6}$/i.test(v)) return v;
  const m = v.match(/rgba?\(([^)]+)\)/);
  if (!m) return '#888888';
  const [r,g,b] = m[1].split(',').map(x => Math.max(0, Math.min(255, parseInt(x,10) || 0)));
  return '#' + [r,g,b].map(x => x.toString(16).padStart(2,'0')).join('');
}


/* ==================================================================
   PANEL MODES
   The customising panels are tall. Docking one to the side drops the
   scrim so the stage behind stays live and clickable, which is the
   only way to judge a colour or a layout while you are choosing it.
   ================================================================== */
function setUpPanels(){
  document.querySelectorAll('.setup').forEach(panel => {
    const card = panel.querySelector('.card');
    if (!card || card.querySelector('.panelbar')) return;

    const bar = document.createElement('div');
    bar.className = 'panelbar';
    bar.innerHTML =
      `<button data-act="side">${esc(t('panelDock'))}</button>` +
      `<button data-act="min">${esc(t('panelMin'))}</button>` +
      `<button data-act="close">${esc(t('panelClose'))}</button>`;
    card.appendChild(bar);

    const label = () => {
      bar.querySelector('[data-act="side"]').textContent =
        t(panel.classList.contains('docked') ? (panel.classList.contains('left') ? 'panelCentre' : 'panelLeft') : 'panelDock');
      bar.querySelector('[data-act="min"]').textContent =
        t(panel.classList.contains('min') ? 'panelMax' : 'panelMin');
    };

    bar.onclick = e => {
      const act = e.target.dataset.act;
      if (!act) return;
      if (act === 'close'){ panel.classList.remove('on'); return; }
      if (act === 'min'){
        panel.classList.toggle('min');
        if (panel.classList.contains('min')) panel.classList.remove('docked','left');
        card.style.transform = '';
      }
      if (act === 'side'){
        panel.classList.remove('min');
        if (!panel.classList.contains('docked')) panel.classList.add('docked');
        else if (!panel.classList.contains('left')) panel.classList.add('left');
        else panel.classList.remove('docked','left');
        card.style.transform = '';
      }
      label();
    };

    /* Drag by the title. Only once it is out of the centred modal state —
       dragging a full-screen scrim would be meaningless. */
    let sx = 0, sy = 0, ox = 0, oy = 0, live = false;
    const h3 = card.querySelector('h3');
    if (h3) h3.addEventListener('pointerdown', ev => {
      if (!panel.classList.contains('docked') && !panel.classList.contains('min')) return;
      live = true; sx = ev.clientX; sy = ev.clientY;
      const m = /translate\((-?[\d.]+)px,\s*(-?[\d.]+)px\)/.exec(card.style.transform || '');
      ox = m ? +m[1] : 0; oy = m ? +m[2] : 0;
      h3.setPointerCapture(ev.pointerId);
      document.body.classList.add('dragging');
    });
    addEventListener('pointermove', ev => {
      if (!live) return;
      card.style.transform = `translate(${ox + ev.clientX - sx}px, ${oy + ev.clientY - sy}px)`;
    });
    addEventListener('pointerup', () => { live = false; document.body.classList.remove('dragging'); });

    label();
  });
}

function hydrateStaticText(){
  document.querySelectorAll('[data-text]').forEach(el => {
    const v = t(el.dataset.text);
    el.textContent = v;
    if (el.classList.contains('sponsor-prefix')) el.hidden = !v;   // no stray gap when blank
  });

  $('cdBtn').textContent    = t(state.countdown ? 'opsCountdownOn' : 'opsCountdownOff');
}

function render(){

  document.title = t('pageTitle', { event: CONFIG.event });

  line('spDesc', s.description);
  $('spOffer').textContent = s.offer;
  const el = $('eventLogo');
  if (CONFIG.eventLogo){ el.src = CONFIG.eventLogo; el.hidden = false; }

  $('poolLine').innerHTML = state.drawn.size
    ? t(tk ? 'poolLineAfter' : 'poolLineNamesAfter', { eligible: `<b>${pool}</b>`, won: state.drawn.size })
    : t(tk ? 'poolLineFirst' : 'poolLineNames', { eligible: `<b>${pool}</b>` });

  const live = liveWinners();
  $('chips').innerHTML = live.length
    ? live.map((w,i) => `<span class="chip"><i>${i+1}</i><b>${esc(w.name)}</b></span>`).join('')
    : `<span class="none">${esc(t(tk ? 'winnersEmpty' : 'winnersEmptyNames',
        { total: ATTENDEES.length }))}</span>`;

  $('drawBtn').disabled = state.busy || left === 0 || pool === 0;

      pool === 0  ? t('drawPoolEmpty')
    : left === 0  ? t('drawAllDone')
    : live.length ? t('drawNext', { next: live.length + 1, total: s.winnerCount })
    :               t('drawFirst');

  $('sponsorPills').innerHTML = CONFIG.sponsors.map((sp,i) => {
    const done = remaining(sp) === 0 ? 1 : 0;

  }).join('');
  $('sponsorPills').querySelectorAll('.stab').forEach(b =>
    b.onclick = () => switchSponsor(+b.dataset.i));

  $('status').innerHTML =

     <span class="sep"></span>
     <span>${esc(t('statusPrizes', { given: live.length, total: s.winnerCount }))}</span>`;
}

/* ==================================================================
   8 · THE DRAW
   ================================================================== */
/* The winner's name is set in CSS at a size that suits a typical name. A long
   one wraps to a second line and pushes the layout into the prize panel. This
   measures the actual space left and steps the size down until it fits, once
   per draw, using the longest name that could appear. */
function fitName(sample){
  const el = $('bigName');
  el.style.fontSize = '';
  const keep = el.textContent;
  if (sample != null) el.textContent = sample;
  const room = () => {
    const a = $('poolLine').getBoundingClientRect();
    const p = document.querySelector('.prize').getBoundingClientRect();
    return p.top - a.bottom;
  };
  let size = parseFloat(getComputedStyle(el).fontSize), guard = 0;
  while (room() < 12 && size > 26 && guard++ < 60){
    size *= 0.95;
    el.style.fontSize = size.toFixed(1) + 'px';
  }
  if (sample != null) el.textContent = keep;
}

function draw(){
  if (state.busy) return;
  const pool = eligible();
  if (!pool.length || remaining() === 0) return;

  /* The winner is decided NOW, before any animation. The animation is
     theatre — if it picked the winner, a dropped frame would change it. */
  const winner = pool[randomIndex(pool.length)];

  state.busy = true;
  $('drawBtn').disabled = true;
  $('undoBtn').hidden = true;
  $('arena').classList.remove('revealed');
  $('arena').classList.remove('idle');
  $('meta').classList.remove('on');
  $('bigName').className = 'rolling';
  $('bigName').style.filter = 'none';
  $('bigName').style.transform = 'none';
  $('bigName').textContent = '';
  // size for the longest name that could come up, so it never jumps mid-spin
  fitName(pool.concat(winner).reduce((a,b) => b.name.length > a.name.length ? b : a).name);
  Sound.wake();

  /* Names cycle behind a motion blur that clears as the spin slows, so no
     individual name is legible until the winner lands. Duration is fixed
     whatever the list size, which is the point: a 500-name list costs the
     same as a 50-name one, and nobody can ask why their name never showed. */
  const spin = () => {
    document.body.classList.remove('counting');
    $('orb').classList.add('fast');
    $('bigName').classList.add('rolling');

    if (reduceMotion()){ setTimeout(() => reveal(winner), 300); return; }

    // Blur has to be relative to the rendered type size, which changes with
    // the viewport, or the same setting smears a laptop and does nothing to
    // a projector.
    const fontPx = parseFloat(getComputedStyle($('bigName')).fontSize) || 100;
    const maxBlur = Math.max(SPIN.blurMin, Math.min(SPIN.blurMax, fontPx * SPIN.blurRatio));

    // Roll call only works if each name is on screen long enough to read.
    let delay = state.look.winnerStyle === 'rollcall' ? 130 : SPIN.startDelay;
    let elapsed = 0;
    const step = () => {
      if (elapsed > SPIN.budget){ reveal(winner); return; }
      $('bigName').textContent = pool[Math.floor(Math.random() * pool.length)].name;

      // Cubic, not linear: a linear decay is already down to half blur by
      // mid-spin, which is legible again. This holds the smear until the end
      // and then clears it quickly.
      const p = Math.min(1, elapsed / SPIN.budget);           // 0 fast … 1 stopped
      const ease = 1 - p * p * p;
      const el = $('bigName');
      el.classList.remove('st-slot','st-fade');

      switch (state.look.winnerStyle){
        case 'scramble':
          // random glyphs, so not even a real name is legible on the way past
          el.textContent = Array.from({length: 4 + Math.floor(Math.random()*9)},
            () => 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)]).join('');
          el.style.filter = `blur(${(maxBlur * ease * 0.35).toFixed(2)}px)`;
          el.style.transform = 'none';
          break;
        case 'slot':
          el.classList.add('st-slot');
          el.style.filter = `blur(${(maxBlur * ease * 0.45).toFixed(2)}px)`;
          el.style.transform = `translateY(${(ease * 26 * (Math.random() < .5 ? -1 : 1)).toFixed(1)}px)`;
          break;
        case 'fade':
          el.classList.add('st-fade');
          el.style.filter = 'none';
          el.style.opacity = (0.25 + Math.random() * 0.5).toFixed(2);
          el.style.transform = 'none';
          break;

        case 'rollcall':
          // deliberately readable: the point is that the room sees real names
          el.style.filter = 'none';
          el.style.transform = 'none';
          el.style.opacity = '';
          break;

        case 'typewriter':
          // random glyphs on the way past; the resolve happens at the reveal
          el.textContent = Array.from({length: 5 + Math.floor(Math.random()*8)},
            () => 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'[Math.floor(Math.random()*26)]).join('');
          el.style.filter = 'none';
          el.style.transform = 'none';
          break;

        case 'punch':
          el.classList.add('st-punch');
          el.style.filter = 'none';
          el.style.opacity = '';
          el.style.transform = `scale(${(1 + 0.55 * ease).toFixed(3)})`;
          break;

        case 'reel':
          // always upward, never random — reads as one strip travelling
          el.classList.remove('st-reel'); void el.offsetWidth; el.classList.add('st-reel');
          el.style.filter = `blur(${(maxBlur * ease * 0.3).toFixed(2)}px)`;
          el.style.transform = 'none';
          break;

        case 'glitch':
          el.classList.add('st-glitch');
          el.style.filter = 'none';
          el.style.opacity = '';
          el.style.transform =
            `translate(${(Math.random()*10-5).toFixed(1)}px, ${(Math.random()*6-3).toFixed(1)}px)`;
          el.style.textShadow =
            `${(Math.random()*8-4).toFixed(1)}px 0 var(--accent), ${(Math.random()*-8+4).toFixed(1)}px 0 var(--dim)`;
          break;

        case 'curtain':
          // a narrow bright band is all you get until the wipe at the end
          el.classList.add('st-curtain');
          el.style.filter = 'none';
          el.style.transform = 'none';
          el.style.setProperty('--wipe', (12 + Math.random() * 76).toFixed(1) + '%');
          break;
        default:
          el.style.filter = `blur(${(maxBlur * ease).toFixed(2)}px)`;
          el.style.transform = `scaleY(${(1 + SPIN.maxStretch * ease).toFixed(3)})`;
      }

      Sound.tick();
      elapsed += delay; delay *= SPIN.slowdown;
      setTimeout(step, delay);
    };
    step();
  };

  if (state.countdown && !reduceMotion()){
    document.body.classList.add('counting');
    runCountdown(spin);
  } else spin();
}

function runCountdown(then){
  const el = $('countdown');
  let n = 3;
  const tick = () => {
    el.textContent = n;
    el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
    Sound.beep(3 - n);
    n--;
    if (n > 0) setTimeout(tick, 640);
    else setTimeout(() => { el.classList.remove('on'); el.textContent = ''; then(); }, 640);
  };
  tick();
}

/* How the winner's name arrives. Most styles snap in; typewriter resolves
   letter by letter and curtain wipes a band away, so they get their own
   endings rather than reusing the slam. */
function showWinnerName(name){
  const el = $('bigName');
  el.style.filter = 'none';
  el.style.transform = 'none';
  el.style.opacity = '';
  el.style.textShadow = '';
  el.style.removeProperty('--wipe');
  el.className = '';

  const style = state.look.winnerStyle;
  if (reduceMotion() || (style !== 'typewriter' && style !== 'curtain')){
    el.className = 'slam';
    el.textContent = name;
    return;
  }

  if (style === 'curtain'){
    el.className = 'st-wipe';
    el.textContent = name;
    return;
  }

  // typewriter: hold the length steady so the layout never jumps, and swap
  // each slot from a random glyph to the real letter, left to right
  const chars = name.split('');
  const pool = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  let i = 0;
  el.textContent = chars.map(c => c === ' ' ? ' ' : pool[Math.floor(Math.random()*26)]).join('');
  (function step(){
    if (i >= chars.length){ el.className = 'st-locked'; el.textContent = name; return; }
    el.textContent = chars.slice(0, i + 1).join('') +
      chars.slice(i + 1).map(c => c === ' ' ? ' ' : pool[Math.floor(Math.random()*26)]).join('');
    i++;
    setTimeout(step, 42);
  })();
}

function reveal(w){
  $('orb').classList.remove('fast');
  $('arena').classList.add('revealed');

  state.drawn.add(w.ticket);
  const sp = SP();
  state.winners.push({ ...w, at: new Date().toISOString(), status: 'won',
    sponsorId: sp.id, sponsorName: sp.name, prize: sp.offer });

  showWinnerName(w.name);
  /* Name only on the projection. Company, ticket and every other column the
     CSV carried live in Total winners, where the prize desk reads them off. */
  $('meta').innerHTML = '';
  $('meta').classList.remove('on');
  // Re-fit once the reveal transitions have settled — the orb shrinks and the
  // pool line changes wording, so the layout measured mid-animation is wrong.
  setTimeout(() => fitName(), 750);

  $('sweep').classList.remove('on'); void $('sweep').offsetWidth; $('sweep').classList.add('on');
  document.body.classList.remove('shake'); void document.body.offsetWidth;
  document.body.classList.add('shake');
  Confetti.burst(210);
  Sound.fanfare();

  const num = $('poolLine').querySelector('b');
  if (num){ num.classList.remove('bump'); void num.offsetWidth; num.classList.add('bump'); }

  state.busy = false;
  render();
  setTimeout(() => $('drawBtn').focus(), 700);
}

/* Every winner, grouped by sponsor, readable straight off the screen. */
function renderWinnersPanel(){

  $('wpCount').textContent = total
    ? t('winnersPanelHint', { count: total, sponsors: CONFIG.sponsors.length })

     clean; the prize desk gets the whole row. */

    return `<dl class="wdet">${rows.map(([k,v]) =>

  };

  $('winnersBody').innerHTML = CONFIG.sponsors.map(sp => {
    const all = state.winners.filter(w => w.sponsorId === sp.id);
    const live = all.filter(w => w.status !== 'absent');
    const items = all.length
      ? `<ol>${all.map(w => {
          const absent = w.status === 'absent';

            absent ? ` <span>(${esc(t('winnersAbsent'))})</span>` : ''}${detail(w)}</li>`;
        }).join('')}</ol>`
      : `<p class="none">${esc(t('sponsorNoWinners'))}</p>`;

      <h5>${esc(sp.name)}</h5>

}

function winnersAsText(){
  const out = [CONFIG.title, ''];
  CONFIG.sponsors.forEach(sp => {
    const all = state.winners.filter(w => w.sponsorId === sp.id);
    out.push(sp.name + ' — ' + sp.offer);
    if (!all.length) out.push('  (none yet)');
    all.forEach((w, i) => {
      out.push('  ' + (i + 1) + '. ' + w.name +
        (w.status === 'absent' ? '  [' + t('winnersAbsent') + ']' : ''));
      const bits = [];
      if (state.hasTickets && w.ticket) bits.push(t('fieldTicket') + ': ' + w.ticket);
      if (w.company) bits.push(t('fieldCompany') + ': ' + w.company);
      if (w.email)   bits.push(t('fieldEmail') + ': ' + w.email);
      (w.extra || []).forEach(x => bits.push(x.label + ': ' + x.value));
      bits.forEach(b => out.push('       ' + b));
    });
    out.push('');
  });
  return out.join('\n');
}

function switchSponsor(i){
  if (state.busy || i === CONFIG.activeSponsor) return;

  $('arena').classList.add('idle');
